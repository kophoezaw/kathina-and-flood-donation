<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERROR</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      grid-auto-rows: minmax(90px, 1fr);
      gap: 8px;
      padding: 8px;
      overflow-wrap: anywhere;
    }
    .word {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d40000;
      font-size: clamp(24px, 5vw, 64px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.04em;
      border: 2px solid #d40000;
      border-radius: 8px;
      min-height: 90px;
    }
    @media (max-width: 480px) {
      .page { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .word { font-size: clamp(28px, 10vw, 48px); }
    }
  </style>
</head>
<body>
  <main class="page" id="page" aria-label="ERROR repeated across the screen"></main>
  <script>
    const page = document.getElementById('page');
    const count = Math.max(24, Math.ceil((window.innerWidth * window.innerHeight) / 18000));
    for (let i = 0; i < count; i++) {
      const item = document.createElement('div');
      item.className = 'word';
      item.textContent = 'Error';
      page.appendChild(item);
    }
  </script>
</body>
</html>
